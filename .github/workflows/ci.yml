name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in the root package.json;
      # passing it here as well makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # dist/ must exist before format:check — the repo dogfoods apotheke as a
      # prettier plugin loaded from packages/apotheke/dist.
      - run: pnpm build

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm fallow:audit

      - run: pnpm test
