name: Release

on:
  push:
    tags:
      - "[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint the short-lived OIDC token npm exchanges for
      # publish rights. No NPM_TOKEN is involved — see "Trusted publishing".
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the "packageManager" field in the root package.json;
      # passing it here as well makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v4

      # No registry-url here on purpose. It makes setup-node write an .npmrc
      # containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}", and
      # with no token in the environment that line resolves to an empty
      # credential. npm then authenticates as an anonymous user instead of
      # falling through to OIDC, and the registry rejects the PUT as a 404.
      # registry.npmjs.org is already the default registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./packages/apotheke/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      # dist/ must exist before format:check — the repo dogfoods apotheke as a
      # prettier plugin loaded from packages/apotheke/dist.
      - run: pnpm build

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Published with npm, not pnpm: only the npm CLI implements the OIDC
      # exchange that trusted publishing relies on. Authentication comes from
      # the id-token permission above, so no secret is read here.
      #
      # npmjs.com must list this repository and workflow filename as a trusted
      # publisher for the package, otherwise the registry rejects the publish.
      #
      # No --provenance flag: trusted publishing generates and uploads the
      # provenance attestation on its own, and passing the flag explicitly
      # opts back into the token-based signing path.
      # The README lives at the repository root so GitHub shows it on the
      # landing page, but npm only reads the one next to package.json. Copy it
      # in at publish time rather than keeping a second copy in the tree.
      - name: Stage README for the published package
        run: cp README.md packages/apotheke/README.md

      - name: Publish to npm
        working-directory: packages/apotheke
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
