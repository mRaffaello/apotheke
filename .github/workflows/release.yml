name: Release

on:
  push:
    tags:
      - "[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint the short-lived OIDC token npm exchanges for
      # publish rights. No NPM_TOKEN is involved — see "Trusted publishing".
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the "packageManager" field in the root package.json;
      # passing it here as well makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./packages/apotheke/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      # dist/ must exist before format:check — the repo dogfoods apotheke as a
      # prettier plugin loaded from packages/apotheke/dist.
      - run: pnpm build

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Published with npm, not pnpm: only the npm CLI implements the OIDC
      # exchange that trusted publishing relies on. Authentication comes from
      # the id-token permission above, so no secret is read here.
      #
      # npmjs.com must list this repository and workflow filename as a trusted
      # publisher for the package, otherwise the registry rejects the publish.
      - name: Publish to npm
        working-directory: packages/apotheke
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
